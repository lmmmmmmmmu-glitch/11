<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录测试-调试版</title>
</head>
<body style="font-family:Arial;text-align:center;padding:50px">
    <h2>🔐 登录测试 (调试版)</h2>
    <input id="user" placeholder="用户名" value="管理员"><br><br>
    <input id="pwd" type="password" placeholder="密码" value="BBBCBBC0"><br><br>
    <button onclick="login()">登录</button>
    <div id="debug" style="margin-top:20px;background:#f0f0f0;padding:10px;text-align:left;font-size:12px;word-break:break-all"></div>
    <p id="msg"></p>

    <script>
        const url = 'https://raw.githubusercontent.com/lmmmmmmmmu-glitch/888.github.io/main/watermark_users.json';
        
        async function login() {
            const debug = document.getElementById('debug');
            const msg = document.getElementById('msg');
            
            debug.innerHTML = '1️⃣ 开始请求: ' + url + '<br>';
            
            try {
                const response = await fetch(url);
                debug.innerHTML += '2️⃣ 响应状态: ' + response.status + ' ' + response.statusText + '<br>';
                
                const text = await response.text();
                debug.innerHTML += '3️⃣ 返回内容长度: ' + text.length + ' 字符<br>';
                debug.innerHTML += '4️⃣ 前200字符: ' + text.substring(0, 200) + '<br>';
                
                let data;
                try {
                    data = JSON.parse(text);
                    debug.innerHTML += '5️⃣ JSON解析成功<br>';
                    debug.innerHTML += '6️⃣ 数据内容: ' + JSON.stringify(data).substring(0, 300) + '<br>';
                } catch(e) {
                    debug.innerHTML += '❌ JSON解析失败: ' + e.message + '<br>';
                    msg.innerHTML = '❌ 用户列表格式错误';
                    return;
                }
                
                const user = document.getElementById('user').value;
                const pwd = document.getElementById('pwd').value;
                debug.innerHTML += '7️⃣ 输入的用户名: ' + user + ' 密码: ' + pwd + '<br>';
                
                // 检查用户列表（兼容中文和英文键名）
                let users = data.用户 || data.users;
                if (!users) {
                    debug.innerHTML += '❌ 没找到用户列表，键名是: ' + Object.keys(data).join(', ') + '<br>';
                    msg.innerHTML = '❌ 用户列表格式错误，键名应为"用户"或"users"';
                    return;
                }
                
                debug.innerHTML += '8️⃣ 用户列表共 ' + users.length + ' 个账号<br>';
                
                const valid = users.find(u => (u.用户名 === user || u.username === user) && (u.口令 === pwd || u.password === pwd));
                
                if (valid) {
                    debug.innerHTML += '9️⃣ ✅ 找到匹配用户!<br>';
                    msg.innerHTML = '✅ 登录成功！';
                    msg.style.color = 'green';
                } else {
                    debug.innerHTML += '9️⃣ ❌ 没有匹配的用户<br>';
                    msg.innerHTML = '❌ 用户名或密码错误';
                    msg.style.color = 'red';
                }
                
            } catch(e) {
                debug.innerHTML += '❌ 请求失败: ' + e.message + '<br>';
                msg.innerHTML = '❌ 读取失败: ' + e.message;
                msg.style.color = 'red';
            }
        }
    </script>
</body>
</html>
